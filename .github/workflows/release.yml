name: Release LecturePack runtime

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact v{app_version} tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  signed-runtime-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Bind selected tag to checked-out commit before signing
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in v*) ;; *) echo "::error::Release tag must start with v"; exit 1;; esac
          APP_VERSION="${TAG#v}"
          [ -n "$APP_VERSION" ] || { echo "::error::Release tag has no version"; exit 1; }
          TAG_COMMIT="$(git rev-parse "refs/tags/v${APP_VERSION}^{commit}" 2>/dev/null)" || { echo "::error::Missing or ambiguous release tag"; exit 1; }
          HEAD_COMMIT="$(git rev-parse HEAD)" || exit 1
          FULL_OBJECT_ID='^[0-9a-f]{40,64}$'
          [[ "$TAG_COMMIT" =~ $FULL_OBJECT_ID && "$HEAD_COMMIT" =~ $FULL_OBJECT_ID ]] || { echo "::error::Tag and HEAD must resolve to full object IDs"; exit 1; }
          [ "$TAG_COMMIT" = "$HEAD_COMMIT" ] || { echo "::error::Peeled tag commit does not equal checked-out HEAD"; exit 1; }
          FILE_VERSION="$(python -c "import sys; sys.path.insert(0, 'app'); from desktop.version import __version__; print(__version__)")"
          [ "$APP_VERSION" = "$FILE_VERSION" ] || { echo "::error::Tag and application version disagree"; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          mkdir -p verified-wheels
          python -m pip download --only-binary=:all: --no-deps --dest verified-wheels cryptography==49.0.0 cffi==2.0.0 pycparser==2.22
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'cryptography-49.0.0-*.whl': 'e5dfc1e64de5677cec922ffa8da89c546d0415bf6efdf081842e5d44c84e1f0e',
              'cffi-2.0.0-cp312-cp312-win_amd64.whl': 'da68248800ad6320861f129cd9c1bf96ca849a2771a59e0344e88681905916f5',
              'pycparser-2.22-py3-none-any.whl': 'c3702b6d3dd8c7abc1afa565d7e63d53a1d0bd86cdc24edd75470f4de499cfcc',
          }
          for pattern, expected_digest in expected.items():
              wheel = next(Path('verified-wheels').glob(pattern))
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              assert digest == expected_digest, f'{wheel.name} hash mismatch: {digest}'
              print(f'verified {wheel.name}: {digest}')
          PY
          python -m pip install --no-index --find-links verified-wheels pycparser==2.22 cffi==2.0.0 cryptography==49.0.0
          python -m pip install -r app/requirements.txt -r app/requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build canonical disposable onedir
        working-directory: app
        run: python packaging/build.py

      - name: Produce exactly six signed runtime assets
        shell: bash
        env:
          LECTUREPACK_RELEASE_ED25519_PRIVATE_KEY_HEX: ${{ secrets.LECTUREPACK_RELEASE_ED25519_PRIVATE_KEY_HEX }}
        run: |
          python scripts/build_signed_runtime_release.py --app-version "$APP_VERSION" --runtime-root app/dist/LecturePack --output-directory runtime-release-assets > runtime-release-audit.json
          test "$(find runtime-release-assets -maxdepth 1 -type f | wc -l)" = 6
          python - <<'PY'
          import json
          from pathlib import Path
          from app.desktop.version import __version__
          manifest = json.loads(next(Path('runtime-release-assets').glob('*RuntimeManifest-v1.json')).read_text(encoding='utf-8'))
          assert manifest['app_version'] == __version__
          PY

      - name: Assert updater assets exist
        shell: bash
        run: |
          SETUP="app/dist/installer/LecturePack-${APP_VERSION}-Setup.exe"
          SUMS="app/dist/installer/LecturePack-${APP_VERSION}-SHA256SUMS.txt"
          for f in "$SETUP" "$SUMS"; do
            test -s "$f" || { echo "::error::missing or empty updater asset: $f"; exit 1; }
          done
          grep -q "LecturePack-${APP_VERSION}-Setup.exe" "$SUMS" || { echo "::error::$SUMS does not list Setup.exe"; exit 1; }

      - name: Release exact signed assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          prerelease: ${{ contains(env.APP_VERSION, '-') }}
          files: |
            runtime-release-assets/LecturePack-${{ env.APP_VERSION }}-RuntimeManifest-v1.json
            runtime-release-assets/LecturePack-${{ env.APP_VERSION }}-RuntimeManifest-v1.json.sig
            runtime-release-assets/LecturePack-${{ env.APP_VERSION }}-Runtime-ffmpeg.zip
            runtime-release-assets/LecturePack-${{ env.APP_VERSION }}-Runtime-whisper-cpu.zip
            runtime-release-assets/LecturePack-${{ env.APP_VERSION }}-Runtime-model-base-en.zip
            runtime-release-assets/LecturePack-${{ env.APP_VERSION }}-Runtime-smoke-fixture.zip
            app/dist/installer/LecturePack-${{ env.APP_VERSION }}-Setup.exe
            app/dist/installer/LecturePack-${{ env.APP_VERSION }}-SHA256SUMS.txt
            app/dist/installer/LecturePack-${{ env.APP_VERSION }}-release-manifest.json

      - name: Retain signing audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release-audit-v${{ env.APP_VERSION }}
          path: runtime-release-audit.json
          retention-days: 90
