name = "lecturepack-ai-gateway"
main = "src/index.js"
compatibility_date = "2026-08-12"
workers_dev = true

[ai]
binding = "AI"

# Production D1 binding. OPENROUTER_API_KEY, TOKEN_SIGNING_SECRET, and
# NETWORK_HASH_SECRET are Worker secrets, never plaintext vars.
[[d1_databases]]
binding = "DB"
database_name = "lecturepack-study-prod"
database_id = "0ddaa845-8302-48d9-8fec-7d601f8be82c"
migrations_dir = "migrations"

# Fast, permissive edge protection. Durable per-install/day enforcement is
# additionally backed by D1 because this binding is intentionally eventually
# consistent and local to a Cloudflare location.
[[ratelimits]]
name = "INSTALL_LIMITER"
namespace_id = "21001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "NETWORK_LIMITER"
namespace_id = "21002"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "REGISTRATION_LIMITER"
namespace_id = "21003"
simple = { limit = 20, period = 60 }

[vars]
MIN_APP_VERSION = "2.0.1"
DAILY_INSTALL_LIMIT = "250"
TOKEN_TTL_DAYS = "90"
MAX_REQUEST_BYTES = "3500000"
OWNER_ALERT_EMAIL = "discordsammy2@gmail.com"
ALERT_FROM_EMAIL = ""
ALERT_COOLDOWN_SECONDS = "3600"
TELEMETRY_RETENTION_DAYS = "30"

# Models and route order are intentionally server-controlled. OpenRouter and
# native Workers AI provide independent failure domains. Long-form tasks put
# Workers AI first; other tasks put OpenRouter first. Duplicate identical
# routes are removed by the Worker.
OPENROUTER_PRIMARY_MODEL = "openrouter/free"
OPENROUTER_ASK_MODEL = "openrouter/free"
OPENROUTER_TEACH_ME_MODEL = "openrouter/free"
OPENROUTER_GRADE_SHORT_ANSWER_MODEL = "openrouter/free"
OPENROUTER_FALLBACK_MODEL = "openrouter/free"
OPENROUTER_VISION_MODEL = "openrouter/free"
OPENROUTER_VISION_FALLBACK_MODEL = "openrouter/free"
WORKERS_AI_PRIMARY_MODEL = "@cf/openai/gpt-oss-20b"
WORKERS_AI_INTERACTIVE_MODEL = "@cf/openai/gpt-oss-20b"
WORKERS_AI_VISION_MODEL = "@cf/google/gemma-4-26b-a4b-it"
WORKERS_AI_FIRST_TASKS = "study_material_generation,regenerate_concept"
